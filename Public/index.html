<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAMANAVA Oil Price Update</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    header {
      text-align: center;
      color: white;
      padding: 30px 20px;
      margin-bottom: 30px;
    }
    header h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    header p { opacity: 0.9; font-size: 1rem; }
    .last-update {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 0.85rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .fuel-name {
      font-size: 0.9rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .price {
      font-size: 2.4rem;
      font-weight: 700;
      color: #1e3c72;
      margin-bottom: 6px;
    }
    .price-range {
      font-size: 0.85rem;
      color: #888;
    }
    .source-info {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .source-info a { color: #2a5298; text-decoration: none; font-weight: 600; }
    .source-info a:hover { text-decoration: underline; }
    .loading, .error {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      color: #666;
    }
    .error { color: #c0392b; }
    .refresh-btn {
      display: block;
      margin: 20px auto 0;
      padding: 10px 24px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .refresh-btn:hover { background: #1e3c72; }
    footer {
      text-align: center;
      color: rgba(255,255,255,0.8);
      margin-top: 30px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>⛽ CAMANAVA Oil Price Update</h1>
      <p>Latest fuel prices in the Philippines</p>
      <div class="last-update" id="lastUpdate">Loading...</div>
    </header>

    <div id="content" class="loading">Fetching latest prices...</div>

    <div class="source-info">
      <strong>Data Source:</strong> Department of Energy (DOE) weekly oil price monitor via 
      <a href="https://www.fuelprice.ph/" target="_blank">fuelprice.ph</a><br>
      <small>DOE updates every Tuesday. App checks daily at 9AM Manila time.</small>
      <button class="refresh-btn" onclick="loadPrices()">Refresh Now</button>
    </div>

    <footer>
      <p>Caloocan • Malabon • Navotas • Valenzuela</p>
    </footer>
  </div>

  <script>
    async function loadPrices() {
      const content = document.getElementById('content');
      const lastUpdate = document.getElementById('lastUpdate');
      content.className = 'loading';
      content.textContent = 'Fetching latest prices...';

      try {
        const res = await fetch('/api/prices');
        const data = await res.json();

        if (!data.prices || data.prices.length === 0) {
          content.className = 'error';
          content.textContent = 'No price data yet. Scraper may still be running. Refresh in 10 seconds.';
          return;
        }

        if (data.lastUpdate) {
          const d = new Date(data.lastUpdate);
          lastUpdate.textContent = `Last checked: ${d.toLocaleString('en-PH', { 
            timeZone: 'Asia/Manila',
            dateStyle: 'medium',
            timeStyle: 'short'
          })}`;
        }

        content.className = 'grid';
        content.innerHTML = data.prices.map(p => `
          <div class="card">
            <div class="fuel-name">${p.fuel_type}</div>
            <div class="price">₱${p.price_avg.toFixed(2)}</div>
            <div class="price-range">
              ${p.price_min !== p.price_max 
                ? `Range: ₱${p.price_min.toFixed(2)} - ₱${p.price_max.toFixed(2)}` 
                : 'per liter'}
            </div>
          </div>
        `).join('');

      } catch (err) {
        content.className = 'error';
        content.textContent = 'Error loading prices: ' + err.message;
      }
    }

    loadPrices();
    setInterval(loadPrices, 5 * 60 * 1000);
  </script>
</body>
</html>
